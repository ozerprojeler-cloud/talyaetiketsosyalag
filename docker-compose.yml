version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_asistan_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - ai_network
    depends_on:
      - db
      - redis
  db:
    image: mysql:8.0
    container_name: ai_asistan_db
    environment:
      MYSQL_DATABASE: ai_asistan
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ai_network
  redis:
    image: redis:7-alpine
    container_name: ai_asistan_redis
    ports:
      - "6379:6379"
    networks:
      - ai_network
  nginx:
    image: nginx:alpine
    container_name: ai_asistan_nginx
    ports:
      - "80:80"
    volumes:
      - .:/app
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ai_network
    depends_on:
      - app
volumes:
  db_data:

networks:
  ai_network:
    driver: bridge